# Tagged release (PAR-OPS-03). Pushing a tag vX.Y.Z runs `make release` on each platform
# (cargo --locked, Go -trimpath with CGO off, a start-up check of the built binaries) and
# creates a DRAFT GitHub release holding the archives, their .sha256 files and SHA256SUMS.
# The owner reviews the draft and publishes it, then bumps packaging/homebrew/xmustard.rb
# from SHA256SUMS. A manual run builds and uploads the archives as workflow artifacts
# without creating a release (a dry run).
#
# Reproducibility: Go comes from api-go/go.mod (the toolchain check.yml tests with), Rust
# is pinned below, dependencies are locked, and no build cache is restored, so a release
# never consumes a cache written by a pull-request run. Actions are pinned to commit SHAs;
# the tag is in the comment.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  # The Rust toolchain the build box validates every workstream with (it built v0.1.0).
  RUST_TOOLCHAIN: "1.93.1"

jobs:
  build:
    name: build ${{ matrix.platform }}
    strategy:
      fail-fast: true
      matrix:
        include:
          # the platform label must equal `uname -s`-`uname -m` on the runner (checked below)
          - platform: linux-x86_64
            runner: ubuntu-24.04 # glibc 2.39: the floor for the Linux binaries
          - platform: darwin-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: api-go/go.mod
          cache: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      # A tag must read vMAJOR.MINOR.PATCH with an optional pre-release suffix; a manual run
      # is named after its commit.
      - name: Release version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" != push ]; then
            echo "version=dev-${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag $TAG is not vX.Y.Z or vX.Y.Z-pre"
            exit 1
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
      - name: make release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          make release VERSION="$VERSION"
          test -f "dist/xmustard-$VERSION-$PLATFORM.tar.gz"
          test -f "dist/xmustard-$VERSION-$PLATFORM.tar.gz.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.platform }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  publish:
    name: draft GitHub release
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Verify the checksums and write SHA256SUMS
        working-directory: dist
        run: |
          shasum -a 256 -c ./*.tar.gz.sha256
          cat ./*.tar.gz.sha256 | sort -k 2 > SHA256SUMS
          cat SHA256SUMS
      # Release notes come from docs/releases/<tag>.md when it exists. `gh release create`
      # fails if the release already exists, so a re-pushed tag never replaces assets.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          notes=(--generate-notes)
          if [ -f "docs/releases/$TAG.md" ]; then notes=(--notes-file "docs/releases/$TAG.md"); fi
          gh release create "$TAG" --draft --verify-tag --title "xMustard $TAG" "${notes[@]}" \
            dist/*.tar.gz dist/*.tar.gz.sha256 dist/SHA256SUMS
