# DIAGNOSTIC BRANCH ONLY (diag/ci-rss-1023, never merged). Measures why budget gate v2's
# v1-workload peaks ~111-116 MiB on GitHub runners vs ~85 MiB on the Linux build box, by
# printing the runner's memory environment and running the same gate under variants.
name: check
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: never
  PYTHONUNBUFFERED: "1"
jobs:
  rss-diag:
    name: budget gate RSS diagnosis
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: api-go/go.mod
          cache-dependency-path: api-go/go.sum
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust-core
      - name: Memory environment
        run: |
          uname -a; nproc; ldd --version | head -1; go version; cargo --version
          echo "THP enabled: $(cat /sys/kernel/mm/transparent_hugepage/enabled)"
          echo "THP defrag: $(cat /sys/kernel/mm/transparent_hugepage/defrag)"
          echo "khugepaged defrag: $(cat /sys/kernel/mm/transparent_hugepage/khugepaged/defrag)"
          grep -E 'MemTotal|MemAvailable|AnonHugePages|HugePages_Total' /proc/meminfo
          cat /proc/sys/vm/overcommit_memory
      - run: cd rust-core && cargo build --release
      - name: "Gate D: THP never (baseline for this round)"
        run: |
          echo never | sudo tee /sys/kernel/mm/transparent_hugepage/enabled
          make bench-gate BENCH_OUT=bench-out/diag-d BENCH_ARGS="--repeat 2" || true
      - name: "Gate E: THP never + glibc trim/mmap thresholds 128 KiB"
        run: GLIBC_TUNABLES=glibc.malloc.trim_threshold=131072:glibc.malloc.mmap_threshold=131072 make bench-gate BENCH_OUT=bench-out/diag-e BENCH_ARGS="--repeat 2" || true
      - name: "Gate F: THP never + tunables + MALLOC_ARENA_MAX=1"
        run: MALLOC_ARENA_MAX=1 GLIBC_TUNABLES=glibc.malloc.trim_threshold=131072:glibc.malloc.mmap_threshold=131072 make bench-gate BENCH_OUT=bench-out/diag-f BENCH_ARGS="--repeat 2" || true
      - name: Per-process peak breakdown
        run: |
          for r in bench-out/diag-*/; do echo "== $r"; find "$r" -name report.json | head -3 | while read f; do python3 - "$f" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          def walk(o, path=""):
              if isinstance(o, dict):
                  for k, v in o.items():
                      if any(t in k.lower() for t in ("peak", "rss", "process", "by_role", "breakdown")) and not isinstance(v, (dict, list)):
                          print(f"{path}/{k} = {v}")
                      walk(v, f"{path}/{k}")
              elif isinstance(o, list):
                  for i, v in enumerate(o[:40]):
                      walk(v, f"{path}[{i}]")
          walk(d)
          PY
          done; done 2>&1 | head -200
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diag-rss-reports
          path: bench-out/
