# DIAGNOSTIC BRANCH ONLY (diag/ci-rss-1023, never merged). Measures why budget gate v2's
# v1-workload peaks ~111-116 MiB on GitHub runners vs ~85 MiB on the Linux build box, by
# printing the runner's memory environment and running the same gate under variants.
name: check
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: never
  PYTHONUNBUFFERED: "1"
jobs:
  rss-diag:
    name: budget gate RSS diagnosis
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: api-go/go.mod
          cache-dependency-path: api-go/go.sum
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust-core
      - name: Memory environment
        run: |
          uname -a; nproc; ldd --version | head -1; go version; cargo --version
          echo "THP enabled: $(cat /sys/kernel/mm/transparent_hugepage/enabled)"
          echo "THP defrag: $(cat /sys/kernel/mm/transparent_hugepage/defrag)"
          echo "khugepaged defrag: $(cat /sys/kernel/mm/transparent_hugepage/khugepaged/defrag)"
          grep -E 'MemTotal|MemAvailable|AnonHugePages|HugePages_Total' /proc/meminfo
          cat /proc/sys/vm/overcommit_memory
      - run: cd rust-core && cargo build --release
      - name: "Gate A: default environment"
        run: make bench-gate BENCH_OUT=bench-out/diag-a BENCH_ARGS="--repeat 2" || true
      - name: "Gate B: MALLOC_ARENA_MAX=2"
        run: MALLOC_ARENA_MAX=2 make bench-gate BENCH_OUT=bench-out/diag-b BENCH_ARGS="--repeat 2" || true
      - name: "Gate C: THP madvise"
        run: |
          echo madvise | sudo tee /sys/kernel/mm/transparent_hugepage/enabled
          make bench-gate BENCH_OUT=bench-out/diag-c BENCH_ARGS="--repeat 2" || true
      - name: "Gate D: THP never"
        run: |
          echo never | sudo tee /sys/kernel/mm/transparent_hugepage/enabled
          make bench-gate BENCH_OUT=bench-out/diag-d BENCH_ARGS="--repeat 2" || true
