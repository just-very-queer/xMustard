name: peer-registry

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  peer-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python3 scripts/test_check_peer_registry.py
      - run: python3 scripts/check_peer_registry.py --check
