[package]
name = "xmustard-core"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "xmustard_core"
path = "src/lib.rs"

[dependencies]
chrono = { version = "0.4", features = ["clock", "serde"] }
rustix = { version = "1", features = ["fs", "process", "stdio"] }
tree-sitter = "0.25"
tree-sitter-go = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
# Language packs (WS-16, PAR-SYM-05, D-22): each grammar is an optional dependency behind
# its `lang-*` feature. `default` ships every pack (the worker binary is the release
# build); `--no-default-features` drops them and those languages fall back to the
# precompiled lexical extractor, reported as unsupported in coverage.
tree-sitter-python = { version = "0.25", optional = true }
tree-sitter-java = { version = "0.23", optional = true }
tree-sitter-c = { version = "0.24", optional = true }
tree-sitter-cpp = { version = "0.23", optional = true }
tree-sitter-c-sharp = { version = "0.23", optional = true }
tree-sitter-ruby = { version = "0.23", optional = true }
tree-sitter-php = { version = "0.24", optional = true }
tree-sitter-kotlin-ng = { version = "1.1", optional = true }
tree-sitter-swift = { version = "0.7", optional = true }
tree-sitter-bash = { version = "0.25", optional = true }
streaming-iterator = "0.1"
regex = "1.12"
roxmltree = "0.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
thiserror = "2.0"
walkdir = "2.5"
percent-encoding = "2.3"
# Code index store (WS-07, PAR-STORE-03): one SQLite file per workspace under
# <git-dir>/xmustard-cache/index-v3. `bundled` compiles SQLite with FTS5 (contentless
# chunk postings) so the index never depends on the host library. D-02 measurement:
# docs/benchmarks/2026-09-25-d02-fts5-vs-tantivy.md.
rusqlite = { version = "0.32.1", features = ["bundled"] }
# Watcher (WS-15, PAR-FRESH-03): FSEvents on macOS, inotify on Linux, through one API.
# The resident service watches registered roots and queues debounced index refreshes.
notify = "8.2"

# Neural semantic lane (XM-PRO-012): the ort(onnxruntime)+tokenizers backend is a heavy
# native dependency (~120-160 MB peak), so it is OPTIONAL and pulled in ONLY by the
# semantic-onnx feature. The default build never compiles or links it — the lean
# 50-100 MB / no-Docker profile is preserved.
fastembed = { version = "5", optional = true }

[dev-dependencies]
tempfile = "3.23"
# tests/index_build.rs reads a child's peak RSS with wait4(2) (test code only; the
# library keeps #![forbid(unsafe_code)]).
libc = "0.2"

[features]
default = ["lang-all"]
lang-all = [
  "lang-python", "lang-java", "lang-c", "lang-cpp", "lang-csharp", "lang-ruby",
  "lang-php", "lang-kotlin", "lang-swift", "lang-bash",
]
lang-python = ["dep:tree-sitter-python"]
lang-java = ["dep:tree-sitter-java"]
lang-c = ["dep:tree-sitter-c"]
lang-cpp = ["dep:tree-sitter-cpp"]
lang-csharp = ["dep:tree-sitter-c-sharp"]
lang-ruby = ["dep:tree-sitter-ruby"]
lang-php = ["dep:tree-sitter-php"]
lang-kotlin = ["dep:tree-sitter-kotlin-ng"]
lang-swift = ["dep:tree-sitter-swift"]
lang-bash = ["dep:tree-sitter-bash"]
# Opt-in neural semantic lane (local int8 ONNX via fastembed/ort); off by default to keep
# the lean no-Docker / 50-100 MB profile. See search.rs onnx_embed (XM-PRO-012).
semantic-onnx = ["dep:fastembed"]

# Debug/test builds hash up to the 64 MiB identity budget; an unoptimized SHA-256 made
# that regression take ~12 s. Optimizing only this dependency keeps tests about behavior.
# Release builds are unaffected.
[profile.dev.package.sha2]
opt-level = 3

# The index tests build 5,000-file fixtures through bundled SQLite and the tree-sitter
# grammars (C code); unoptimized C made those runs several times slower.
[profile.dev.package.libsqlite3-sys]
opt-level = 3
[profile.dev.package.tree-sitter]
opt-level = 3
[profile.dev.package.tree-sitter-go]
opt-level = 3
[profile.dev.package.tree-sitter-rust]
opt-level = 3
[profile.dev.package.tree-sitter-typescript]
opt-level = 3
[profile.dev.package.tree-sitter-javascript]
opt-level = 3
[profile.dev.package.tree-sitter-python]
opt-level = 3
[profile.dev.package.tree-sitter-java]
opt-level = 3
[profile.dev.package.tree-sitter-c]
opt-level = 3
[profile.dev.package.tree-sitter-cpp]
opt-level = 3
[profile.dev.package.tree-sitter-c-sharp]
opt-level = 3
[profile.dev.package.tree-sitter-ruby]
opt-level = 3
[profile.dev.package.tree-sitter-php]
opt-level = 3
[profile.dev.package.tree-sitter-kotlin-ng]
opt-level = 3
[profile.dev.package.tree-sitter-swift]
opt-level = 3
[profile.dev.package.tree-sitter-bash]
opt-level = 3
