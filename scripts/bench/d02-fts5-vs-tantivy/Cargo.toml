# D-02 measurement probe (WS-07 first deliverable): rusqlite FTS5 versus tantivy for
# function-aligned code chunks. Standalone crate, not part of rust-core; see
# docs/benchmarks/2026-09-25-d02-fts5-vs-tantivy.md and run.sh.
[package]
name = "d02-probe"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
rusqlite = { version = "0.32.1", features = ["bundled"] }
tantivy = "0.24.2"
serde_json = "1"
libc = "0.2"

[profile.release]
opt-level = 3
